; ============================================================================
;  Rewind Together - Steam P2P transport profile
;  Installed to: %LOCALAPPDATA%\RetroRewind\Saved\Config\Windows\Engine.ini
; ============================================================================
;
;  Retro Rewind already ships SteamCore Pro, which provides a net driver on top
;  of Steam's relay network (SteamCoreSocketsNetDriver). Routing the game net
;  driver through it means players connect by Steam ID with no port forwarding
;  and no exposed listening port.
;
;  DriverClassNameFallback keeps the stock IP driver as a backup, so if Steam
;  networking is unavailable the game still starts instead of failing to travel.
;
;  Everything here is additive to the game's packaged config. Delete this file
;  to return the game to stock.
; ============================================================================

[/Script/Engine.Engine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SteamCoreSockets.SteamCoreSocketsNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="/Script/Engine.DemoNetDriver",DriverClassNameFallback="/Script/Engine.DemoNetDriver")

[/Script/SteamCoreSockets.SteamCoreSocketsNetDriver]
NetConnectionClassName="/Script/SteamCoreSockets.SteamCoreSocketsNetConnection"
; Store sims push a lot of small prop updates; the stock 10 KB/s cap starves them.
MaxClientRate=100000
MaxInternetClientRate=100000
; Generous timeouts: the host may hitch while streaming in the store on travel.
InitialConnectTimeout=120.0
ConnectionTimeout=60.0
KeepAliveTime=0.2
NetServerMaxTickRate=60

[/Script/OnlineSubsystemUtils.IpNetDriver]
NetConnectionClassName="/Script/OnlineSubsystemUtils.IpConnection"
MaxClientRate=100000
MaxInternetClientRate=100000
InitialConnectTimeout=120.0
ConnectionTimeout=60.0
NetServerMaxTickRate=60

[OnlineSubsystemSteamCore]
bEnabled=True
; Relay through Steam's servers when a direct P2P route cannot be negotiated.
bAllowP2PPacketRelay=True
P2PConnectionTimeout=90
; Without this the plugin does not install its socket subsystem, the net
; driver class fails to resolve, and the engine silently falls back to
; IpNetDriver - which cannot understand a steam.<id> URL, so guests get
; bounced to the main menu with no error anywhere.
bUseSteamNetworking=True

[/Script/SteamCoreSockets.SteamCoreSocketsNetConnection]
MaxClientRate=100000
MaxInternetClientRate=100000

[OnlineSubsystem]
DefaultPlatformService=SteamCore

[/Script/Engine.GameSession]
MaxPlayers=4
MaxSpectators=2

[/Script/Engine.GameNetworkManager]
; Headroom for replicated props and AI customers on top of player movement.
TotalNetBandwidth=200000
MaxDynamicBandwidth=100000
MinDynamicBandwidth=8000
; Server-side movement validation is tuned for shooters and will rubber-band
; players who get pushed around by physics props in a cramped store.
MAXPOSITIONERRORSQUARED=1024
MAXNEARZEROVELOCITYSQUARED=196
CLIENTERRORUPDATEINTERVAL=0.5

[URL]
Port=27015
